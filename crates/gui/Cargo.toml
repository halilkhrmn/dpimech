[package]
name = "dpimech-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "dpimech"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dpimech-core.workspace = true
global-hotkey = "0.8.0"
rfd = "0.17.2"
serde = { workspace = true, features = ["derive"] }
slint.workspace = true
png = "0.18.1"
tokio.workspace = true
toml.workspace = true
tray-icon.workspace = true

[build-dependencies]
slint-build.workspace = true
winresource = "0.1.31"

# tray-icon's Linux backend is GTK; the tray lives on its own GTK thread (see tray.rs).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"
# Loads the appindicator copy bundled in the AppImage when the system has none.
libloading = "0.8.9"

[target."cfg(windows)".dependencies]
lnk = "0.6.4"
winreg = "0.56.0"
windows-sys.workspace = true
tauri-winrt-notification = "0.8.1"

# Linux packages (tools/build-linux-packages.sh). The service ships in /usr/lib/dpimech and runs
# as the packaged systemd unit; `target/release/dpimech.service` is generated by
# `dpimech-service unit` so packages and `dpimech-service install` share one unit.
[package.metadata.deb]
name = "dpimech"
maintainer = "Halil <halilkahraman@yandex.com>"
copyright = "DPIMech contributors"
license-file = ["../../LICENSE", "0"]
section = "net"
priority = "optional"
extended-description = """\
Opens sites and apps that your internet provider blocks with DPI, by running well-known \
open-source bypass engines (zapret, ByeDPI). Not a VPN: traffic still goes straight to the sites."""
depends = "$auto, libayatana-appindicator3-1, libxkbcommon-x11-0, nftables, systemd"
recommends = "libnotify-bin"
maintainer-scripts = "../../packaging/linux/deb"
assets = [
    ["target/release/dpimech", "usr/bin/", "755"],
    ["target/release/dpimech-service", "usr/lib/dpimech/", "755"],
    ["target/release/dpimech.service", "usr/lib/systemd/system/", "644"],
    ["../../packaging/linux/service-setup.sh", "usr/lib/dpimech/", "755"],
    ["../../packaging/linux/dpimech.desktop", "usr/share/applications/", "644"],
    ["assets/dpimech.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
]

[package.metadata.generate-rpm]
name = "dpimech"
license = "GPL-3.0-or-later"
summary = "Open sites your internet provider blocks (DPI bypass manager)"
post_install_script = "/usr/lib/dpimech/service-setup.sh"
# $1 is the number of versions left after the transaction: 0 = removal, not upgrade.
pre_uninstall_script = "if [ \"$1\" -eq 0 ] && [ -d /run/systemd/system ]; then systemctl disable --now dpimech.service >/dev/null 2>&1 || true; fi"
post_uninstall_script = "if [ -d /run/systemd/system ]; then systemctl daemon-reload || true; fi"
assets = [
    { source = "target/release/dpimech", dest = "/usr/bin/dpimech", mode = "755" },
    { source = "target/release/dpimech-service", dest = "/usr/lib/dpimech/dpimech-service", mode = "755" },
    { source = "target/release/dpimech.service", dest = "/usr/lib/systemd/system/dpimech.service", mode = "644" },
    { source = "../../packaging/linux/service-setup.sh", dest = "/usr/lib/dpimech/service-setup.sh", mode = "755" },
    { source = "../../packaging/linux/dpimech.desktop", dest = "/usr/share/applications/dpimech.desktop", mode = "644" },
    { source = "assets/dpimech.png", dest = "/usr/share/icons/hicolor/256x256/apps/dpimech.png", mode = "644" },
]

[package.metadata.generate-rpm.requires]
gtk3 = "*"
libayatana-appindicator-gtk3 = "*"
libxkbcommon-x11 = "*"
nftables = "*"
systemd = "*"
