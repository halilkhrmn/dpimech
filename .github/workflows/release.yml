name: Release

# A new version is published when `main` gets a `version` in Cargo.toml that has no tag yet
# (merge a pull request that raises it); the workflow creates the tag vX.Y.Z itself. Pushing a
# tag by hand works too. Actions → Release → Run workflow builds everything without publishing
# (a dry run). See docs/RELEASING.md.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# Two quick merges must not publish the same version twice.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - name: Decide what to do
        id: plan
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tag="v$version"
          build=false
          publish=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            build=true
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            if [ "$tag" != "${{ github.ref_name }}" ]; then
              echo "::error::Tag ${{ github.ref_name }} does not match Cargo.toml version $version"
              exit 1
            fi
            build=true
            publish=true
          elif git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag is already released; nothing to publish (raise the version to release)"
          else
            build=true
            publish=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  windows:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: windows-latest
    # A stuck apt or cargo download otherwise holds the runner for six hours.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Read the version
        shell: pwsh
        run: '"VERSION=${{ needs.plan.outputs.version }}" >> $env:GITHUB_ENV'

      - name: Install Inno Setup (if the runner lacks it)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build binaries and installer
        shell: pwsh
        run: ./tools/build-installer.ps1

      - name: Package
        shell: pwsh
        run: |
          $out = "target/dist"
          New-Item -ItemType Directory $out -Force | Out-Null
          Copy-Item "target/installer/dpimech-setup-$env:VERSION.exe" $out
          Compress-Archive -Path target/release/dpimech.exe, target/release/dpimech-service.exe -DestinationPath "$out/dpimech-$env:VERSION-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: target/dist/*

  # Built on the oldest supported Ubuntu so the binaries run on newer glibc versions too
  # (Ubuntu 22.04+, Debian 12+, Fedora 36+).
  linux:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-22.04
    # A stuck apt or cargo download otherwise holds the runner for six hours.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build dependencies and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev dpkg-dev file
          cargo install --locked cargo-deb cargo-generate-rpm

      - name: Build .deb, .rpm and AppImage
        run: ./tools/build-linux-packages.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            target/linux/*.deb
            target/linux/*.rpm
            target/linux/*.AppImage

  macos:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: macos-latest
    # A stuck apt or cargo download otherwise holds the runner for six hours.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build DPIMech.app and .dmg (universal, unsigned)
        # On failure the last log lines become an annotation, readable without the raw log.
        run: |
          set +e
          ./tools/build-macos-app.sh 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "::error title=macOS build failed::$(grep -v '^\s*Compiling' build.log | tail -n 40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          fi
          exit "$code"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: target/macos/*.dmg

  # Install each package on a clean system and start it before anything is published: a missing
  # library (libxdo on CachyOS, 0.2.7) or a GUI that cannot start then stops the release.
  smoke-linux:
    needs: [plan, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # A bare Arch: no libayatana-appindicator, no xdotool, no libxkbcommon-x11 (the script checks the
          # message about it, then installs it), like CachyOS out of the box.
          - name: AppImage on Arch
            image: archlinux:latest
            kind: appimage
            pattern: "*.AppImage"
            setup: pacman -Syu --noconfirm gtk3 xorg-server-xvfb ttf-dejavu python
          - name: .deb on Ubuntu 24.04
            image: ubuntu:24.04
            kind: deb
            pattern: "*.deb"
            setup: apt-get update && apt-get install -y xvfb python3
          - name: .rpm on Fedora
            image: fedora:latest
            kind: rpm
            pattern: "*.rpm"
            setup: dnf install -y xorg-x11-server-Xvfb python3
    name: Smoke test, ${{ matrix.name }}
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: dist
      - name: Prepare the system
        run: ${{ matrix.setup }}
      - name: Install and start
        run: bash tools/smoke-linux.sh ${{ matrix.kind }} dist/${{ matrix.pattern }}

  smoke-windows:
    needs: [plan, windows]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist
      - name: Install, start, uninstall
        shell: pwsh
        run: ./tools/smoke-windows.ps1 "dist/dpimech-setup-${{ needs.plan.outputs.version }}.exe"

  publish:
    needs: [plan, windows, linux, macos, smoke-linux, smoke-windows]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      TAG: v${{ needs.plan.outputs.version }}
      # Fedora packages are built by COPR from the tag (see docs/RELEASING.md). Optional secret:
      # the "custom webhook" URL of the dpimech package in COPR.
      COPR_WEBHOOK_URL: ${{ secrets.COPR_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * | tee SHA256SUMS.txt
      # The user-facing notes of this version (changelog/en.md, also shown in the app), then
      # GitHub's list of merged pull requests.
      - name: Release notes
        run: awk -v v="## ${TAG#v}" '$0 == v { f = 1; next } /^## / { f = 0 } f' changelog/en.md > release-notes.md
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: DPIMech ${{ env.TAG }}
          body_path: release-notes.md
          generate_release_notes: true
          files: dist/*
      - name: Start the Fedora COPR build
        if: env.COPR_WEBHOOK_URL != ''
        # The release is already out; a COPR problem should be visible, not fail the release.
        continue-on-error: true
        run: ./tools/copr-webhook.sh

  # Arch User Repository: dpimech-bin repackages the .deb (packaging/aur, tools/aur-publish.sh).
  # Every run builds and installs it in a clean Arch; a real release also pushes it, after the
  # GitHub release exists (the PKGBUILD downloads from there). Optional secret: AUR_SSH_PRIVATE_KEY.
  aur:
    needs: [plan, linux, smoke-linux, publish]
    if: always() && needs.smoke-linux.result == 'success' && (needs.publish.result == 'success' || needs.plan.outputs.publish != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: archlinux:latest
    # The Arch package, built from the release .deb and installed in a clean Arch, is attached to the
    # release (`sudo pacman -U`). Publishing to the AUR is on hold: it takes no new accounts (DECISIONS #48).
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: dist
      - name: Build and install dpimech-bin
        run: PKG_OUT=arch bash tools/aur-publish.sh "$VERSION" "dist/dpimech_${VERSION}-1_amd64.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: arch/*
      - name: Attach to the release
        if: needs.plan.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: DPIMech v${{ env.VERSION }}
          files: arch/*
