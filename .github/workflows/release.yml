name: Release

# Two ways to publish version X.Y.Z (the `version` in Cargo.toml):
#   git push origin main:release          (the workflow creates the tag vX.Y.Z itself)
#   git tag vX.Y.Z && git push origin vX.Y.Z
# Pushing the branch `release-check` runs every build without publishing, to try the
# packaging first. See docs/RELEASING.md.
on:
  push:
    tags: ["v*"]
    branches: [release, release-check]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    # A stuck apt or cargo download otherwise holds the runner for six hours.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Read the version (and check it matches the tag)
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ("${{ github.ref_type }}" -eq "tag" -and "v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match Cargo.toml version $version"
          }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Install Inno Setup (if the runner lacks it)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build binaries and installer
        shell: pwsh
        run: ./tools/build-installer.ps1

      - name: Package
        shell: pwsh
        run: |
          $out = "target/dist"
          New-Item -ItemType Directory $out -Force | Out-Null
          Copy-Item "target/installer/dpimech-setup-$env:VERSION.exe" $out
          Compress-Archive -Path target/release/dpimech.exe, target/release/dpimech-service.exe -DestinationPath "$out/dpimech-$env:VERSION-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: target/dist/*

  # Built on the oldest supported Ubuntu so the binaries run on newer glibc versions too
  # (Ubuntu 22.04+, Debian 12+, Fedora 36+).
  linux:
    runs-on: ubuntu-22.04
    # A stuck apt or cargo download otherwise holds the runner for six hours.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "${{ github.ref_name }}" || { echo "Tag ${{ github.ref_name }} does not match Cargo.toml version $version"; exit 1; }

      - name: Build dependencies and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev dpkg-dev file
          cargo install --locked cargo-deb cargo-generate-rpm

      - name: Build .deb, .rpm and AppImage
        run: ./tools/build-linux-packages.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            target/linux/*.deb
            target/linux/*.rpm
            target/linux/*.AppImage

  macos:
    runs-on: macos-latest
    # A stuck apt or cargo download otherwise holds the runner for six hours.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "${{ github.ref_name }}" || { echo "Tag ${{ github.ref_name }} does not match Cargo.toml version $version"; exit 1; }

      - name: Build DPIMech.app and .dmg (universal, unsigned)
        # On failure the last log lines become an annotation, readable without the raw log.
        run: |
          set +e
          ./tools/build-macos-app.sh 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "::error title=macOS build failed::$(grep -v '^\s*Compiling' build.log | tail -n 40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          fi
          exit "$code"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: target/macos/*.dmg

  publish:
    needs: [windows, linux, macos]
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    env:
      # Fedora packages are built by COPR from the tag (see docs/RELEASING.md). Optional secret:
      # the "custom webhook" URL of the dpimech package in COPR.
      COPR_WEBHOOK_URL: ${{ secrets.COPR_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Choose the tag
        # From the `release` branch the tag is created by the release below; refuse to publish a
        # version twice (bump Cargo.toml first).
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tag="v$version"
          if [ "${{ github.ref_type }}" = "branch" ] && git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag is already released. Raise the version in Cargo.toml first."
            exit 1
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * | tee SHA256SUMS.txt
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: DPIMech ${{ env.TAG }}
          generate_release_notes: true
          files: dist/*
      - name: Start the Fedora COPR build
        if: env.COPR_WEBHOOK_URL != ''
        # The release is already out; a COPR problem should be visible, not fail the release.
        continue-on-error: true
        run: ./tools/copr-webhook.sh
